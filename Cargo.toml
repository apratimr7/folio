[package]
name = "folio"
version = "0.2.1"
edition = "2024"
rust-version = "1.95"
description = "A keyboard-first PDF reader for technical documents"
license = "AGPL-3.0-or-later"
repository = "https://github.com/apratimr7/folio"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
crossbeam-channel = "0.5.17"
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "default_fonts", "glow", "persistence", "wayland", "x11", "system_fonts"] }
mlua = { version = "0.12.2", features = ["lua54", "vendored"] }
mupdf = { version = "0.8.0", default-features = false, features = ["base14-fonts"] }
nucleo-matcher = "0.3.1"
pollster = "0.4"
regex = "1.13.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1.0.154"
toml = "1.1.8"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[patch.crates-io]
# Local fixes: null outline titles crash, unresolvable links panic. See vendor/mupdf/FOLIO-PATCHES.md.
mupdf = { path = "vendor/mupdf" }
