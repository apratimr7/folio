name: docs

# Builds the documentation site (mdBook, from docs/) with the API docs for contributors under /dev/, checks the links,
# and publishes it to GitHub Pages from main. One-time setup: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ["docs/**", "book.toml", "README.md", "src/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "book.toml", "README.md"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.95"
  MDBOOK_VERSION: "v0.5.4"

jobs:
  links:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          # Local links and #anchors only: external sites are too flaky to fail a build on.
          args: --offline --include-fragments --no-progress README.md CONTRIBUTING.md 'docs/**/*.md'

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/$MDBOOK_VERSION/mdbook-$MDBOOK_VERSION-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: mdbook build
      # API docs of the source (private items too), for contributors.
      - if: github.event_name != 'pull_request'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev libxkbcommon-dev libgl1-mesa-dev
      - if: github.event_name != 'pull_request'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - if: github.event_name != 'pull_request'
        uses: Swatinem/rust-cache@v2
      - if: github.event_name != 'pull_request'
        run: |
          cargo doc --no-deps --document-private-items
          mkdir -p target/book/dev && cp -r target/doc/. target/book/dev/
          echo '<meta http-equiv="refresh" content="0; url=folio/index.html">' > target/book/dev/index.html
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/book

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [links, build]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
