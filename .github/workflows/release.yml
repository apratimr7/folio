name: release

# Push a tag like v0.2.0 (matching the version in Cargo.toml) to build every platform and publish a GitHub
# Release with the archives, checksums, and the tag's section of CHANGELOG.md as release notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  RUST_TOOLCHAIN: "1.95"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # older glibc (2.35), so the binary also runs on older distributions
            asset: target/release/*-linux-*.tar.gz
          - os: macos-15 # Apple Silicon
            asset: target/release/*-macos-*.zip
          - os: macos-15-intel
            asset: target/release/*-macos-*.zip
          - os: windows-latest
            asset: target/release/*-windows-*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev libxkbcommon-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release # same profile as packaging, so MuPDF is compiled once
      - if: runner.os == 'Linux'
        run: ./scripts/package-linux.sh
      - if: runner.os == 'macOS'
        run: ./scripts/build-macos.sh
      - if: runner.os == 'Windows'
        run: ./scripts/build-windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version" >&2
            exit 1
          fi
      - name: Checksums and release notes
        run: |
          cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS && cat SHA256SUMS && cd ..
          version="${GITHUB_REF_NAME#v}"
          # The tag's section of CHANGELOG.md, without its heading.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ## Download

          | Platform | File |
          |---|---|
          | Linux (x86_64) | `folio-*-linux-x86_64.tar.gz` |
          | macOS, Apple Silicon | `folio-*-macos-arm64.zip` |
          | macOS, Intel | `folio-*-macos-x86_64.zip` |
          | Windows (x86_64) | `folio-*-windows-x86_64.zip` |

          First run: on macOS, right-click the app → *Open* (it isn't notarized yet). On Windows, SmartScreen may say
          the publisher is unknown: *More info* → *Run anyway*. See the README for details.
          EOF
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "folio ${GITHUB_REF_NAME#v}" --notes-file notes.md
